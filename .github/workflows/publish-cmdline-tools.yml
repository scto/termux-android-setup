name: Publish cmdline-tools

# Einmaliger, manueller Task: entpackt cmdline-tools/ temporär aus dem SDK-Archiv (android-sdk-<ver>)
# und veröffentlicht sie als eigenes Release-Asset (cmdline-tools-<Revision>.tar.xz).
# Das Setup-Script lädt dieses Asset statt Googles cmdline-tools (setup-termux-android.sh --cmdline-tools).
# Kein Zeitplan: nur bei Bedarf starten (neue Revision = anderes SDK-Archiv wählen).

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "SDK-Version, aus deren Archiv cmdline-tools entpackt werden"
        required: true
        default: "37.0.0"
        type: string
      dry_run:
        description: "Nur herunterladen, entpacken, packen und prüfen – nichts veröffentlichen"
        required: true
        default: true
        type: boolean
      force:
        description: "Vorhandenes Asset neu hochladen"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-cmdline-tools
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java (Selbsttest des sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: cmdline-tools veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          SDK_VERSION: ${{ inputs.sdk_version }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: bash scripts/publish-cmdline-tools.sh
